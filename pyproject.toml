[project]
name = "l2l-bench"
version = "0.1.0"
description = "Learning to Learn Scientific Reasoning Benchmark"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "dask[dataframe]>=2024.1.0",
    "duckdb>=1.0.0",
    "gseapy>=1.0.0",
    "huggingface_hub>=0.20.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.0",
    "fhaviary>=0.5.0",
    "ldp>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
